<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>spreeder</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, sans-serif;
  background: #0e0e0e;
  color: #d4d4d4;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* ── Input panel ──────────────────────────────────── */
#input-panel {
  display: flex;
  flex-direction: column;
  gap: .6rem;
  padding: 1.2rem;
  flex: 1;
}

#text-input {
  flex: 1;
  resize: none;
  background: #1a1a1a;
  color: #d4d4d4;
  border: 1px solid #333;
  border-radius: 6px;
  padding: .75rem;
  font-size: 1rem;
  line-height: 1.5;
  outline: none;
}
#text-input:focus { border-color: #555; }
#text-input::placeholder { color: #555; }

.controls-row { display: flex; gap: .5rem; align-items: center; }

button {
  background: #222;
  color: #d4d4d4;
  border: 1px solid #444;
  border-radius: 6px;
  padding: .4rem 1rem;
  cursor: pointer;
  font-size: .95rem;
  line-height: 1.4;
  transition: background .1s;
}
button:hover { background: #2e2e2e; }
button:active { background: #3a3a3a; }

#status-msg { font-size: .85rem; color: #666; }

/* ── Reader panel ─────────────────────────────────── */
#reader {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.4rem;
  flex: 1;
}
#reader.active { display: flex; }

/*
  ORP alignment: three-span layout with fixed-width columns.
  pre-orp is right-aligned, orp-char is the red pivot, post-orp is left-aligned.
  The ORP character stays at the same horizontal pixel for every chunk.
*/
#chunk-display {
  display: flex;
  align-items: baseline;
  font-family: 'Courier New', Courier, monospace;
  font-size: 2.8rem;
  line-height: 1;
  user-select: none;
}
#pre-orp {
  display: inline-block;
  width: 12ch;
  text-align: right;
}
#orp-char {
  display: inline-block;
  width: 1ch;
  text-align: center;
  color: #e74c3c;
}
#post-orp {
  display: inline-block;
  width: 12ch;
  text-align: left;
}

#progress-bar-wrap {
  width: 320px;
  height: 3px;
  background: #222;
  border-radius: 2px;
  overflow: hidden;
}
#progress-bar {
  height: 100%;
  background: #444;
  transition: width .1s linear;
  width: 0%;
}

.reader-controls { display: flex; gap: .5rem; }
</style>
</head>
<body>

<!-- Input panel -->
<div id="input-panel">
  <textarea id="text-input" placeholder="Paste text here…"></textarea>
  <div class="controls-row">
    <button id="play-btn">Play</button>
    <span id="status-msg"></span>
  </div>
</div>

<!-- Reader panel -->
<div id="reader">
  <div id="chunk-display">
    <span id="pre-orp"></span><span id="orp-char"></span><span id="post-orp"></span>
  </div>
  <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
  <div class="reader-controls">
    <button id="stop-btn">Stop</button>
  </div>
</div>

<script type="module">
import { buildSession } from './engine.js';

const textInput  = document.getElementById('text-input');
const playBtn    = document.getElementById('play-btn');
const stopBtn    = document.getElementById('stop-btn');
const inputPanel = document.getElementById('input-panel');
const reader     = document.getElementById('reader');
const preOrp     = document.getElementById('pre-orp');
const orpChar    = document.getElementById('orp-char');
const postOrp    = document.getElementById('post-orp');
const progressBar = document.getElementById('progress-bar');
const statusMsg  = document.getElementById('status-msg');

// Defaults — replaced by settings persistence in a later issue
const settings = { wpm: 300, chunkSize: 1, adaptive: false };

let session = null;
let timer   = null;
let index   = 0;

function renderChunk(chunk, i, total) {
  const { text, orpIndex } = chunk;
  preOrp.textContent  = text.slice(0, orpIndex);
  orpChar.textContent = text[orpIndex] ?? '';
  postOrp.textContent = text.slice(orpIndex + 1);
  progressBar.style.width = `${((i + 1) / total) * 100}%`;
}

function advance() {
  if (index >= session.chunks.length) {
    endPlayback();
    return;
  }
  const chunk = session.chunks[index];
  renderChunk(chunk, index, session.chunks.length);
  const delay = session.chunkDurationMs(chunk);
  index++;
  timer = setTimeout(advance, delay);
}

function startPlayback() {
  const raw = textInput.value;
  session = buildSession(raw, settings);

  if (session.chunks.length === 0) {
    statusMsg.textContent = 'Nothing to read.';
    return;
  }
  statusMsg.textContent = '';
  index = 0;

  inputPanel.style.display = 'none';
  reader.classList.add('active');
  advance();
}

function endPlayback() {
  clearTimeout(timer);
  timer = null;
  reader.classList.remove('active');
  inputPanel.style.display = '';
  progressBar.style.width = '0%';
}

playBtn.addEventListener('click', startPlayback);
stopBtn.addEventListener('click', endPlayback);
</script>
</body>
</html>
