<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>spreeder</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, sans-serif;
  background: #0e0e0e;
  color: #d4d4d4;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* ── Input panel ──────────────────────────────────── */
#input-panel {
  display: flex;
  flex-direction: column;
  gap: .6rem;
  padding: 1.2rem;
  flex: 1;
}

#text-input {
  flex: 1;
  resize: none;
  background: #1a1a1a;
  color: #d4d4d4;
  border: 1px solid #333;
  border-radius: 6px;
  padding: .75rem;
  font-size: 1rem;
  line-height: 1.5;
  outline: none;
}
#text-input:focus { border-color: #555; }
#text-input::placeholder { color: #555; }

.controls-row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }

label { font-size: .9rem; color: #888; display: flex; align-items: center; gap: .35rem; }

input[type="number"] {
  background: #1a1a1a;
  color: #d4d4d4;
  border: 1px solid #444;
  border-radius: 6px;
  padding: .3rem .5rem;
  font-size: .9rem;
  width: 5.5rem;
  outline: none;
}
input[type="number"]:focus { border-color: #555; }

button {
  background: #222;
  color: #d4d4d4;
  border: 1px solid #444;
  border-radius: 6px;
  padding: .4rem 1rem;
  cursor: pointer;
  font-size: .95rem;
  line-height: 1.4;
  transition: background .1s;
}
button:hover { background: #2e2e2e; }
button:active { background: #3a3a3a; }

#status-msg { font-size: .85rem; color: #666; }

/* ── Reader panel ─────────────────────────────────── */
#reader {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.4rem;
  flex: 1;
}
#reader.active { display: flex; }

/*
  ORP alignment: absolute positioning locks the red ORP character at screen centre.
  pre-orp extends left, post-orp extends right. Nothing wraps, nothing drifts.
*/
#chunk-display {
  position: relative;
  width: 100%;
  height: 3rem;
  font-family: 'Courier New', Courier, monospace;
  font-size: 2.8rem;
  line-height: 1;
  user-select: none;
}
#pre-orp {
  position: absolute;
  right: calc(50% + 0.5ch);   /* right edge touches ORP left edge */
  top: 0;
  text-align: right;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: calc(50% - 1ch);
}
#orp-char {
  position: absolute;
  left: 50%;
  top: 0;
  transform: translateX(-50%); /* dead centre */
  color: #e74c3c;
  white-space: nowrap;
}
#post-orp {
  position: absolute;
  left: calc(50% + 0.5ch);    /* left edge touches ORP right edge */
  top: 0;
  text-align: left;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: calc(50% - 1ch);
}

#progress-bar-wrap {
  width: 320px;
  height: 3px;
  background: #222;
  border-radius: 2px;
  overflow: hidden;
}
#progress-bar {
  height: 100%;
  background: #444;
  transition: width .1s linear;
  width: 0%;
}
#progress-text { font-size: .8rem; color: #555; letter-spacing: .03em; }

.reader-controls { display: flex; gap: .5rem; }
</style>
</head>
<body>

<!-- Input panel -->
<div id="input-panel">
  <textarea id="text-input" placeholder="Paste text here…"></textarea>
  <div class="controls-row">
    <button id="play-btn">Play</button>
    <label>WPM <input type="number" id="wpm-input" min="60" max="1500" step="50" value="300"></label>
    <label>Chunk <input type="number" id="chunk-input" min="1" max="10" step="1" value="1"></label>
    <label><input type="checkbox" id="adaptive-toggle"> Adaptive</label>
    <span id="status-msg"></span>
  </div>
</div>

<!-- Reader panel -->
<div id="reader">
  <div id="chunk-display">
    <span id="pre-orp"></span><span id="orp-char"></span><span id="post-orp"></span>
  </div>
  <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
  <div id="progress-text"></div>
  <div class="reader-controls">
    <button id="pause-btn">Pause</button>
    <button id="restart-btn">Restart</button>
    <button id="stop-btn">Stop</button>
  </div>
</div>

<script type="module">
import { buildSession } from './engine.js';

const textInput    = document.getElementById('text-input');
const playBtn      = document.getElementById('play-btn');
const pauseBtn     = document.getElementById('pause-btn');
const restartBtn   = document.getElementById('restart-btn');
const stopBtn      = document.getElementById('stop-btn');
const inputPanel   = document.getElementById('input-panel');
const reader       = document.getElementById('reader');
const preOrp       = document.getElementById('pre-orp');
const orpChar      = document.getElementById('orp-char');
const postOrp      = document.getElementById('post-orp');
const progressBar  = document.getElementById('progress-bar');
const progressText = document.getElementById('progress-text');
const statusMsg    = document.getElementById('status-msg');
const wpmInput        = document.getElementById('wpm-input');
const chunkInput      = document.getElementById('chunk-input');
const adaptiveToggle  = document.getElementById('adaptive-toggle');

function readSettings() {
  return {
    wpm: Math.max(60, parseInt(wpmInput.value, 10) || 300),
    chunkSize: Math.max(1, parseInt(chunkInput.value, 10) || 1),
    adaptive: adaptiveToggle.checked,
  };
}

let session = null;
let timer   = null;
let index   = 0;
let paused  = false;

function renderChunk(chunk, i, total) {
  const { text, orpIndex } = chunk;
  preOrp.textContent  = text.slice(0, orpIndex);
  orpChar.textContent = text[orpIndex] ?? '';
  postOrp.textContent = text.slice(orpIndex + 1);
  progressBar.style.width = `${((i + 1) / total) * 100}%`;
  progressText.textContent = `${i + 1} / ${total}`;
}

function advance() {
  if (index >= session.chunks.length) {
    endPlayback();
    return;
  }
  const chunk = session.chunks[index];
  renderChunk(chunk, index, session.chunks.length);
  const delay = session.chunkDurationMs(chunk);
  index++;
  timer = setTimeout(advance, delay);
}

function pausePlayback() {
  clearTimeout(timer);
  timer = null;
  paused = true;
  // step back so resume re-displays the chunk currently on screen
  if (index > 0) index--;
  pauseBtn.textContent = 'Resume';
}

function resumePlayback() {
  paused = false;
  pauseBtn.textContent = 'Pause';
  advance();
}

function togglePause() {
  if (!session) return;
  if (paused) resumePlayback();
  else pausePlayback();
}

function startPlayback() {
  const raw = textInput.value;
  session = buildSession(raw, readSettings());

  if (session.chunks.length === 0) {
    statusMsg.textContent = 'Nothing to read.';
    return;
  }

  statusMsg.textContent = '';
  index = 0;
  paused = false;
  pauseBtn.textContent = 'Pause';

  inputPanel.style.display = 'none';
  reader.classList.add('active');
  advance();
}

function restartPlayback() {
  if (!session) return;
  clearTimeout(timer);
  timer = null;
  index = 0;
  paused = false;
  pauseBtn.textContent = 'Pause';
  advance();
}

function endPlayback() {
  clearTimeout(timer);
  timer = null;
  paused = false;
  session = null;
  pauseBtn.textContent = 'Pause';
  reader.classList.remove('active');
  inputPanel.style.display = '';
  progressBar.style.width = '0%';
  progressText.textContent = '';
}

playBtn.addEventListener('click', startPlayback);
pauseBtn.addEventListener('click', togglePause);
restartBtn.addEventListener('click', restartPlayback);
stopBtn.addEventListener('click', endPlayback);

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && reader.classList.contains('active')) {
    e.preventDefault();
    togglePause();
  }
});
</script>
</body>
</html>
